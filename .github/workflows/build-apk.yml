name: Build PRIOR RIDING APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Capacitor
        run: npm install

      - name: Prepare web assets
        run: |
          rm -rf www
          mkdir -p www
          cp index.html app.js style.css manifest.json app-config.json pwabuilder-sw.js prior-riding-logo.jpg icon-192.png icon-512.png icon.svg www/

      - name: Create Android project
        run: |
          npx cap init "PRIOR RIDING CRM" "com.priorriding.crm" --web-dir=www
          npx cap add android
          npx cap copy android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: prior-riding-crm-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
