name: Build PRIOR RIDING APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Capacitor
        run: npm install

      - name: Prepare web assets
        run: |
          rm -rf www
          mkdir -p www
          cp index.html app.js style.css manifest.json app-config.json pwabuilder-sw.js pwabuilder-sw-v4.js prior-riding-logo.jpg icon-192.png icon-512.png icon.svg www/

      - name: Create Android project
        run: |
          npx cap init "PRIOR RIDING CRM" "com.priorriding.crm" --web-dir=www
          npx cap add android
          npx cap copy android
          sed -i -E 's/versionCode [0-9]+/versionCode 29/; s/versionName "[^"]+"/versionName "2.9.0"/' android/app/build.gradle

      - name: Restore stable Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android
          key: prior-riding-debug-keystore-v1

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apkanalyzer manifest application-id android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: prior-riding-crm-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
